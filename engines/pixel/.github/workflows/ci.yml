name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows-mock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Tests are self-contained (node:test/assert + a mock helper); no deps.
      - name: Repo check + mock suites
        run: npm test
